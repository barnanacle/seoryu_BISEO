<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{이름}} {{직함}} · {{사무소명}}</title>
<meta name="description" content="{{한줄소개}}">

<!--
  ============================================================
   링크 미리보기(og 태그)
   카카오톡·문자·SNS에 이 명함 주소를 보낼 때 뜨는 카드입니다.
   아래 5줄은 그대로 두고 겹중괄호 자리만 채우면 됩니다.
  ============================================================
-->
<meta property="og:type" content="profile">
<meta property="og:locale" content="ko_KR">
<meta property="og:site_name" content="{{사무소명}}">
<meta property="og:title" content="{{이름}} {{직함}} · {{사무소명}}">
<meta property="og:description" content="{{한줄소개}}">
<meta name="twitter:card" content="summary">

<!--
  ▼ 인터넷 주소로 배포한 뒤에만 아래 주석을 풀고 주소를 채우세요.
     (파일로만 쓰실 때는 주소가 없으므로 필요 없습니다.)
     og:image 는 1200x630 크기, 글자가 없는 배경·상징 이미지를 쓰세요.
     이름·연락처는 이미지가 아니라 위 og:title 에 글자로 들어갑니다.

<meta property="og:url" content="https://example.com/">
<meta property="og:image" content="https://example.com/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="명함 배경 이미지">
     그리고 위의 twitter:card 값을 summary_large_image 로 바꾸세요.
-->

<style>
/* ==========================================================================
   전자명함 스타일시트
   외부 글꼴·CDN·추적 코드·자바스크립트를 쓰지 않습니다. 이 파일 하나로 끝납니다.

   [디자인을 바꾸는 방법]
   아래 CSS를 고치지 마시고, <body ...> 한 줄의 6개 값만 바꾸세요.
   값의 목록과 뜻은 5_챗지피티/명함_디자인표.md 에 있습니다.
   ========================================================================== */

/* ---- 1. 기본값 (라이트 모드 · 먹지 팔레트) — CSS 변수 12개 ---- */
:root{
  --bg:#F6F5F2;
  --surface:#FFFFFF;
  --fg:#1C1C1A;
  --muted:#6B6A66;
  --accent:#2E2C28;
  --accent-soft:#E7E5DF;
  --line:#DCD9D2;
  --band:var(--accent-soft);
  --font-head:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",sans-serif;
  --font-body:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",sans-serif;
  --radius:18px;
  --pad:32px;
}

/* ---- 2. 축1. 색 조합 8종 (라이트) ---- */
body[data-palette="mukji"]    {--bg:#F6F5F2;--surface:#FFFFFF;--fg:#1C1C1A;--muted:#6B6A66;--accent:#2E2C28;--accent-soft:#E7E5DF;--line:#DCD9D2}
body[data-palette="jjokbit"]  {--bg:#F4F6FA;--surface:#FFFFFF;--fg:#16203A;--muted:#5E6A85;--accent:#23407A;--accent-soft:#DCE4F3;--line:#D2DAE8}
body[data-palette="solip"]    {--bg:#F4F7F3;--surface:#FFFFFF;--fg:#17251C;--muted:#5C6B5F;--accent:#2A5B3C;--accent-soft:#DDEADF;--line:#D2DFD4}
body[data-palette="hwangto"]  {--bg:#FAF6EF;--surface:#FFFFFF;--fg:#2A2118;--muted:#7A6A55;--accent:#8A5A22;--accent-soft:#F1E3CE;--line:#E6DAC5}
body[data-palette="jasu"]     {--bg:#F8F5FA;--surface:#FFFFFF;--fg:#221A2C;--muted:#6E6280;--accent:#5B3E86;--accent-soft:#E9E0F3;--line:#DED4EA}
body[data-palette="cheolhoe"] {--bg:#F3F4F5;--surface:#FFFFFF;--fg:#1A1D1F;--muted:#656B70;--accent:#3A4A55;--accent-soft:#E1E5E8;--line:#D6DADD}
body[data-palette="cheongrok"]{--bg:#F1F7F7;--surface:#FFFFFF;--fg:#12262A;--muted:#566E72;--accent:#146B72;--accent-soft:#D6EBEC;--line:#CBE0E1}
body[data-palette="jeokdong"] {--bg:#FAF4F2;--surface:#FFFFFF;--fg:#2B1A16;--muted:#7A6058;--accent:#99402C;--accent-soft:#F3DFD8;--line:#E8D3CB}

/* ---- 3. 다크 모드 — 받는 분의 화면 설정에 따라 자동으로 바뀝니다 ---- */
@media (prefers-color-scheme: dark){
  :root{--bg:#141412;--surface:#1D1D1A;--fg:#F2F1ED;--muted:#A3A199;--accent:#D9D5CB;--accent-soft:#2A2A26;--line:#33322D}
  body[data-palette="mukji"]    {--bg:#141412;--surface:#1D1D1A;--fg:#F2F1ED;--muted:#A3A199;--accent:#D9D5CB;--accent-soft:#2A2A26;--line:#33322D}
  body[data-palette="jjokbit"]  {--bg:#0F1420;--surface:#171E2E;--fg:#E8ECF6;--muted:#98A3BC;--accent:#7CA0E8;--accent-soft:#1D2740;--line:#2A3348}
  body[data-palette="solip"]    {--bg:#0F1511;--surface:#171F19;--fg:#E9F0EA;--muted:#96A79A;--accent:#6FBF8B;--accent-soft:#1B2A20;--line:#29372C}
  body[data-palette="hwangto"]  {--bg:#17130E;--surface:#201A13;--fg:#F5EEE2;--muted:#B0A18B;--accent:#D79A4E;--accent-soft:#2C2115;--line:#3A2E20}
  body[data-palette="jasu"]     {--bg:#14101A;--surface:#1C1724;--fg:#F0EAF6;--muted:#A79BB8;--accent:#A98CE0;--accent-soft:#241C30;--line:#322843}
  body[data-palette="cheolhoe"] {--bg:#111315;--surface:#191C1F;--fg:#ECEEF0;--muted:#9AA1A7;--accent:#90A6B4;--accent-soft:#1F2429;--line:#2C3237}
  body[data-palette="cheongrok"]{--bg:#0D1516;--surface:#141E20;--fg:#E6F1F2;--muted:#93A9AC;--accent:#56BEC4;--accent-soft:#16292B;--line:#24373A}
  body[data-palette="jeokdong"] {--bg:#17110F;--surface:#201815;--fg:#F6EBE7;--muted:#B39A92;--accent:#E08163;--accent-soft:#2C1C17;--line:#3B2823}
}

/* ---- 4. 축3. 글자 조합 3종 (컴퓨터 기본 글꼴만) ---- */
body[data-type="gothic"],
body[data-type="bold"]{
  --font-head:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",sans-serif;
  --font-body:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",sans-serif;
}
body[data-type="myeongjo"]{
  --font-head:"AppleMyungjo",Batang,"바탕",Georgia,serif;
  --font-body:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",sans-serif;
}
body[data-type="bold"] .name{font-weight:800;letter-spacing:-.02em}
body[data-type="bold"] .body-area{line-height:1.75}
body[data-type="myeongjo"] .name{font-weight:600;letter-spacing:0}

/* ---- 5. 축5. 모서리·여백 3종 ---- */
body[data-shape="sharp"]{--radius:0;--pad:20px}
body[data-shape="round"]{--radius:18px;--pad:32px}
body[data-shape="soft"] {--radius:10px;--pad:22px}

/* ---- 6. 축6. 강조 강도 3종 ---- */
body[data-strength="calm"] {--band:var(--line)}
body[data-strength="calm"] .name{color:var(--fg)}
body[data-strength="calm"] .role{color:var(--muted)}
body[data-strength="calm"] .links a{background:transparent;color:var(--fg);border-color:var(--line)}

body[data-strength="mid"]  {--band:var(--accent-soft)}
body[data-strength="mid"] .name{color:var(--fg)}
body[data-strength="mid"] .role{color:var(--accent)}
body[data-strength="mid"] .links a{background:var(--accent-soft);color:var(--accent);border-color:transparent}

body[data-strength="vivid"]{--band:var(--accent)}
body[data-strength="vivid"] .name{color:var(--accent)}
body[data-strength="vivid"] .role{color:var(--muted)}
body[data-strength="vivid"] .links a{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}

/* ---- 7. 뼈대 (모바일 우선 — 명함은 휴대폰으로 열립니다) ---- */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--fg);
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.65;
  -webkit-text-size-adjust:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  padding:20px 14px;
}
.card{
  position:relative;
  width:100%;
  max-width:420px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  overflow:hidden;
}
.head,.body-area{position:relative;z-index:1}
.head{padding:var(--pad)}
.body-area{padding:0 var(--pad) var(--pad)}

.office{margin:0 0 6px;font-size:.85rem;letter-spacing:.06em;color:var(--muted)}
.name{
  margin:0;
  font-family:var(--font-head);
  font-size:1.85rem;
  font-weight:700;
  line-height:1.25;
  display:flex;
  align-items:baseline;
  gap:8px;
  flex-wrap:wrap;
}
.role{font-size:.95rem;font-weight:400}
.tagline{margin:12px 0 0;color:var(--muted);font-size:.98rem}

.block{margin-top:22px}
.block h2{
  margin:0 0 8px;
  font-size:.78rem;
  font-weight:600;
  letter-spacing:.1em;
  color:var(--muted);
  text-transform:none;
}
.works{list-style:none;margin:0;padding:0}
.works li{padding:7px 0;border-bottom:1px solid var(--line);font-size:.98rem}
.works li:last-child{border-bottom:0}

.links{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.links a{
  display:inline-block;
  padding:9px 14px;
  border:1px solid var(--line);
  border-radius:calc(var(--radius) / 2 + 4px);
  font-size:.95rem;
  text-decoration:none;
  word-break:break-all;
}
.links a:hover{filter:brightness(.97)}
a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.foot{margin-top:24px;padding-top:12px;border-top:1px solid var(--line);font-size:.78rem;color:var(--muted)}

.banner{display:none}

/* ---- 8. 축2. 배치 4종 ---- */
/* a — 세로 카드 (기본) */
body[data-layout="a"] .card{max-width:420px}

/* b — 좌측 색띠 사이드바 (좁은 화면에서는 위아래로 접힘) */
body[data-layout="b"] .card{max-width:720px}
@media (min-width:640px){
  body[data-layout="b"] .card{display:grid;grid-template-columns:230px 1fr}
  body[data-layout="b"] .banner{grid-column:1 / -1}
  body[data-layout="b"] .head{
    background:var(--accent-soft);
    border-right:4px solid var(--band);
  }
  body[data-layout="b"] .body-area{padding:var(--pad)}
}
body[data-layout="b"] .head .office,
body[data-layout="b"] .head .tagline{color:var(--fg);opacity:.8}
body[data-layout="b"] .head .role{color:var(--accent)}
body[data-layout="b"][data-strength="calm"] .head .role{color:var(--fg)}

/* c — 상단 밴드 */
body[data-layout="c"] .head{
  background:var(--accent-soft);
  border-bottom:4px solid var(--band);
}
body[data-layout="c"] .body-area{padding:var(--pad)}
body[data-layout="c"] .head .office,
body[data-layout="c"] .head .tagline{color:var(--fg);opacity:.8}
body[data-layout="c"] .head .role{color:var(--accent)}
body[data-layout="c"][data-strength="calm"] .head .role{color:var(--fg)}

/* d — 중앙 미니멀 */
body[data-layout="d"] .card{max-width:460px;text-align:center}
body[data-layout="d"] .head{padding:calc(var(--pad) * 1.6) var(--pad) var(--pad)}
body[data-layout="d"] .name{justify-content:center}
body[data-layout="d"] .links{justify-content:center}
body[data-layout="d"] .works li{border-bottom:0;padding:3px 0}
body[data-layout="d"] .block h2{      /* 소제목은 화면에서 숨기고 읽기 프로그램에는 남김 */
  position:absolute;width:1px;height:1px;margin:-1px;padding:0;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;
}

/* ---- 9. 축4. 장식 모티프 6종 (전부 CSS로만 — 이미지 파일 없음) ---- */
/* none — 장식 없음 */

/* rule — 얇은 이중선 */
body[data-motif="rule"] .name{padding-bottom:10px;border-bottom:3px double var(--line)}

/* seal — 도장 자리 사각 */
.seal{display:none}
body[data-motif="seal"] .seal{
  display:block;position:absolute;top:14px;right:14px;z-index:2;
  width:28px;height:28px;border:2px solid var(--accent);border-radius:3px;opacity:.5;
}
body[data-motif="seal"] .seal::after{
  content:"";position:absolute;inset:6px;border:1px solid var(--accent);
}

/* grid — 옅은 격자 */
body[data-motif="grid"] .card::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;
  background:
    repeating-linear-gradient(0deg,var(--line) 0 1px,transparent 1px 24px),
    repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 24px);
}

/* slant — 사선 그라데이션 */
body[data-motif="slant"] .card::before{
  content:"";position:absolute;left:0;right:0;top:0;height:170px;pointer-events:none;
  background:linear-gradient(135deg,var(--accent-soft),transparent 60%);
}

/* band — 좌측 굵은 색띠 */
body[data-motif="band"] .card{border-left:6px solid var(--band)}

/* 충돌 조정 2건 — 같은 자리에 장식이 겹칠 때만 자동 정리 (명함_디자인표.md 7절) */
body[data-layout="b"][data-motif="band"] .card{border-left:1px solid var(--line)}
body[data-layout="c"][data-motif="slant"] .card::before{opacity:.45}

/* ---- 10. 인쇄 (A4) ---- */
@media print{
  body{background:#fff;color:#000;display:block;padding:0;min-height:auto}
  .card{max-width:none;border:1px solid #999;border-radius:0;break-inside:avoid}
  .card::before,.card::after,.seal{display:none !important}
  .links a{background:transparent !important;color:#000 !important;border-color:#999 !important}
  .head{background:transparent !important;border:0 !important}
}
</style>

<!--
  ▼ (선택) 상단 띠 이미지를 쓰실 때만 아래 주석을 푸세요.
     ⚠️ 이미지에는 글자를 넣지 마세요. 배경·무늬만 씁니다.
        이름·직함·연락처는 아래 HTML 글자로만 적습니다(그림 글자는 틀리게 그려질 수 있습니다).

<style>
  .banner{
    display:block;height:120px;
    background:url("img/banner.jpg") center / cover no-repeat;
    border-bottom:1px solid var(--line);
  }
</style>
-->
</head>

<!--
  ============================================================
   ▼ 디자인을 바꾸는 곳은 아래 한 줄뿐입니다.
     값의 목록: 5_챗지피티/명함_디자인표.md
       data-palette  : mukji jjokbit solip hwangto jasu cheolhoe cheongrok jeokdong
       data-layout   : a b c d
       data-type     : gothic myeongjo bold
       data-motif    : none rule seal grid slant band
       data-shape    : sharp round soft
       data-strength : calm mid vivid
  ============================================================

   ⚠️ 이 파일에 넣으면 안 되는 것
      · 의뢰인 이름·회사명·사건번호·수임 사례  (행정사법 제23조 비밀엄수 의무)
      · 주민등록번호 · 자택 주소 · 가족 정보
      · 지식창고(JARVIS) 폴더 안의 파일을 이 폴더로 복사하는 일
      · 이름·전화번호를 그림(이미지)으로 만들어 넣는 일
-->
<body data-palette="mukji" data-layout="a" data-type="gothic" data-motif="rule" data-shape="round" data-strength="mid">

<main class="card">
  <span class="seal" aria-hidden="true"></span>
  <div class="banner" aria-hidden="true"></div>

  <header class="head">
    <p class="office">{{사무소명}}</p>
    <h1 class="name">{{이름}}<span class="role">{{직함}}</span></h1>
    <p class="tagline">{{한줄소개}}</p>
  </header>

  <div class="body-area">

    <section class="block">
      <h2>취급 업무</h2>
      <ul class="works">
        <li>{{업무1}}</li>
        <li>{{업무2}}</li>
        <li>{{업무3}}</li>
      </ul>
    </section>

    <section class="block">
      <h2>연락</h2>
      <ul class="links">
        <!-- ▼ 인터뷰 13번에서 고르지 않은 수단은 그 <li> 줄을 통째로 지우세요.
                (값을 비워 두면 빈 버튼이 남습니다) -->
        <li><a href="tel:{{전화번호}}">전화 {{전화번호}}</a></li>
        <li><a href="mailto:{{이메일}}">{{이메일}}</a></li>
        <li><a href="{{링크주소}}">{{링크이름}}</a></li>
        <li><a href="{{카카오채널주소}}">카카오톡 채널</a></li>
      </ul>
    </section>

    <!-- 연도는 매년 바꿔 주세요 -->
    <footer class="foot">© 2026 {{사무소명}}</footer>

  </div>
</main>

</body>
</html>
